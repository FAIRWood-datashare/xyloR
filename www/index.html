<!doctype html>
<html>
<head>
  <title>Engine Dashboard App</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    #sidebar {
      width: 220px;
      border-right: 1px solid #ddd;
      padding: 10px;
    }

    #main {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    #inspector {
      width: 260px;
      border-left: 1px solid #ddd;
      padding: 10px;
      background: #fafafa;
    }

    .history-item {
      cursor: pointer;
      padding: 4px;
    }

    .history-item:hover {
      background: #f0f0f0;
    }

    /* CMD OVERLAY ROOT */
    #cmd {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<h2 style="padding:10px;">Engine UI Test (App Runtime)</h2>

<!-- TOP BAR -->
<div style="padding:10px;">
  <button onclick="App.cmd.run('user')">User Change</button>
  <button onclick="App.cmd.run('settings')">Settings Change</button>
  <button onclick="App.undo()">Undo</button>
  <button onclick="App.redo()">Redo</button>
  <button onclick="App.cmd.run('save')">Save</button>
</div>

<!-- APP SHELL -->
<div id="app">
  <div id="sidebar"></div>
  <div id="main"></div>
  <div id="inspector"></div>
</div>

<!-- HISTORY -->
<div style="padding:10px;">
  <h3>History</h3>
  <div id="history"></div>
</div>

<!-- CMD ROOT -->
<div id="cmd"></div>

<!-- ENGINE (MODULE ENTRY) -->
<script type="module" src="./app.js"></script>

<script>
console.log("✅ UI Loaded")

// =====================================================
// HISTORY RENDER (safe bridge layer)
// =====================================================

function renderHistoryUI() {
  const el = document.getElementById("history")
  if (!el || !window.App) return

  el.innerHTML = ""

  const items = App.history.all()

  items.forEach((item, i) => {
    const div = document.createElement("div")
    div.className = "history-item"
    div.textContent = `${i} → ${item.action}`

    div.onclick = () => {
      App.history.go(i)

      // FIXED: deterministic replay contract
      App.state.set(item.state)

      App.render()
    }

    el.appendChild(div)
  })
}

// =====================================================
// SINGLE RENDER BRIDGE (Linear-style contract)
// =====================================================

function renderBridge() {
  renderHistoryUI()
}

// expose for debugging / engine hooks
window.renderBridge = renderBridge

// =====================================================
// CLEAN INIT (NO setTimeout HACKS)
// =====================================================

window.addEventListener("load", () => {
  console.log("📦 App Ready")

  if (window.App?.init) {
    App.init()
  }

  if (window.App?.render) {
    App.render()
  }

  renderHistoryUI()
})
</script>

</body>
</html>
